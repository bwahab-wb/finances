<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Mes Comptes</title>
<meta name="description" content="Suivi de comptes personnels sur mobile, alimenté par un classeur Excel. Aucune connexion bancaire, aucune donnée envoyée.">
<meta name="theme-color" content="#eef1f6">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- L'aurore : ce que les surfaces de verre réfractent. Sans elle, du verre
     translucide ne montrerait rien et l'effet retomberait à plat. -->
<div id="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="app">
  <header class="topbar" id="topbar">
    <h1><span id="title">Mes comptes</span><span class="sub" id="subtitle"></span></h1>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main class="screen is-active" id="view" role="main"></main>
</div>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="Navigation principale" hidden>
  <span class="tab-lens" aria-hidden="true"></span>
  <button role="tab" data-tab="comptes" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    Comptes
  </button>
  <button role="tab" data-tab="operations" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h11M4 12h16M4 17h9"/><path d="m17 5 3 2-3 2"/>
    </svg>
    Opérations
  </button>
  <button role="tab" data-tab="budget" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 14 4-4"/><circle cx="12" cy="18" r="1.3" fill="currentColor" stroke="none"/>
    </svg>
    Budget
  </button>
  <button role="tab" data-tab="analyse" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20V11M12 20V5M19 20v-6"/>
    </svg>
    Analyse
  </button>
  <button role="tab" data-tab="reglages" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>
    </svg>
    Réglages
  </button>
</nav>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Détail">
  <div class="grabber"></div>
  <div id="sheet-body"></div>
</div>

<noscript>
  <p style="padding:24px;font-family:system-ui,sans-serif">Cette application lit ton classeur Excel directement dans le navigateur : JavaScript est nécessaire.</p>
</noscript>

<script src="vendor/xlsx.mini.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/views.js"></script>
<script src="assets/app.js"></script>
<script>
  document.getElementById("btn-settings").addEventListener("click", () => {
    document.querySelector('#tabbar button[data-tab="reglages"]').click();
  });
</script>
</body>
</html>
