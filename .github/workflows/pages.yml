# Publication sur GitHub Pages, pilotée explicitement.
#
# Pourquoi ce fichier plutôt que la publication automatique depuis une branche :
# le pipeline implicite enchaîne un build Jekyll puis un déploiement sur lequel
# on n'a aucune prise, et dont l'étape « deploy » expire au bout de dix minutes
# sans rien dire de plus que « Timeout reached ». Ici, chaque étape est nommée,
# versionnée et relançable — et il n'y a plus de build du tout, puisque le site
# est déjà statique.
#
# ⚠️ EXIGE que la source soit réglée sur « GitHub Actions »
#    (Settings → Pages → Build and deployment → Source).
#    Tant qu'elle reste sur « Deploy from a branch », les DEUX pipelines se
#    déclenchent sur le même commit et se disputent le verrou de déploiement :
#    l'un expire, l'autre est annulé, et rien n'est publié.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. On laisse finir celle en cours au lieu de
# l'annuler : un déploiement interrompu en plein vol peut laisser Pages dans un
# état bloqué, ce qui est justement ce qui fait expirer les suivants.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Rassembler les fichiers à publier
        # On n'envoie que le site. Sans ce tri, l'artefact emporterait aussi
        # .git et .github, qui se retrouveraient servis publiquement — inutile
        # et peu soigné.
        run: |
          mkdir -p _site
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./_site' \
              --exclude='./README.md' \
              -cf - . | tar -xf - -C _site
          echo "Fichiers publiés :"
          find _site -type f | sort

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
